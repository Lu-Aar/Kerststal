[package]
name = "esp32-c3-super-mini-rust"
authors = ["Petr Gadorek <hahihula@gmail.com>"] 
version = "0.1.0"
edition = "2021"

[dependencies]
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
esp-backtrace = { version = "0.19.0", features = ["esp32c3", "panic-handler", "println"] }
esp_hal = { version = "1.1.0", package = "esp-hal", features = ["esp32c3", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32c3"] }
embedded-graphics = "0.8.2"
sh1106 = "0.5.0"
heapless = { version = "0.9.2", default-features = false }
critical-section = "1.2.0"
esp-rtos = { version = "0.3.0", features=["esp32c3", "embassy"] }
embassy-executor    = { version = "0.10.0"}
# embassy-sync              = { version = "0.8.0" }
embassy-time              = { version = "0.5.1" }
# embassy-time-driver       = { version = "0.2.0", features = [ "tick-hz-1_000_000" ] }
smoltcp = { version = "0.12.0", default-features=false, features = [ "proto-ipv4", "socket-tcp", "socket-icmp", "socket-udp", "medium-ethernet", "proto-dhcpv4", "socket-raw", "socket-dhcpv4"] }
futures = { version = "0.3.32", default-features = false, features = ["async-await"] }
futures-util = { version = "0.3.32", default-features = false, features = ["async-await"] }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
strip = false
panic = "abort"
